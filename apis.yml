aid: mudflap
name: Mudflap
description: >-
  Mudflap is a fintech company operating a diesel fuel-discount network for
  truckers, owner-operators, and fleets. Its mobile app delivers instant
  cost-plus diesel discounts (up to $1.00/gallon) at 3,600+ truck stops using a
  driver's existing debit or credit card, and its Mudflap Fuel Card extends
  fleet credit terms, driver spend controls, and fraud protection across 70,000+
  fuel stops nationwide, managed through a fleet dashboard. Mudflap reports
  $1B+ saved by 515,000+ active drivers and is recommended by 94% of
  owner-operators and fleets. It also runs a truck-stop merchant program and a
  Geotab telematics integration. Mudflap is backed by Matrix Partners. The
  company exposes an OAuth 2.0 / OpenID Connect authorization server at
  api.mudflapinc.com for its partner, fleet, and merchant surfaces; no public
  developer OpenAPI is published.
